<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pokédex</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script src="qrc:///qtwebchannel/qwebchannel.js" onerror="void 0"></script>
</head>
<body>
<div id="loader"><div class="ball"></div><p id="loader-text"></p></div>

<header class="topbar"><div class="wrap"><a href="#/" class="brand">Pokédex</a></div></header>

<main class="wrap">
  <section id="view-home" class="view">
    <div class="search-panel">
      <div class="search-top">
        <div class="search-field">
          <label for="q">Name or Number</label>
          <div class="input-wrap">
            <input id="q" type="text" autocomplete="off" spellcheck="false">
            <button id="btn-q" class="btn orange sq" aria-label="Search">
              <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10" cy="10" r="6" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M15 15l6 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div class="info-box hidden" id="info-box"></div>
      </div>

      <div class="adv" id="adv"><div class="adv-inner">
        <div class="adv-grid">
          <div class="adv-types">
            <h4>Type &amp; Weakness</h4>
            <div id="type-list" class="type-list"></div>
          </div>
          <div class="adv-side">
            <h4>Ability</h4>
            <select id="ability" class="select"><option value="">All</option></select>
            <h4>Height</h4>
            <div class="size-btns" id="h-btns">
              <button data-v="s" title="Small"><svg viewBox="0 0 40 30"><ellipse cx="20" cy="22" rx="7" ry="5"/><circle cx="20" cy="14" r="4"/></svg></button>
              <button data-v="m" title="Medium"><svg viewBox="0 0 40 30"><ellipse cx="20" cy="19" rx="9" ry="8"/><circle cx="20" cy="9" r="5"/></svg></button>
              <button data-v="l" title="Large"><svg viewBox="0 0 40 30"><ellipse cx="20" cy="18" rx="13" ry="11"/><circle cx="20" cy="6" r="6"/></svg></button>
            </div>
            <h4>Weight</h4>
            <div class="size-btns" id="w-btns">
              <button data-v="s" title="Light"><svg viewBox="0 0 40 30"><circle cx="20" cy="15" r="4"/></svg></button>
              <button data-v="m" title="Medium"><svg viewBox="0 0 40 30"><circle cx="14" cy="19" r="4"/><circle cx="26" cy="19" r="4"/><circle cx="20" cy="10" r="4"/></svg></button>
              <button data-v="l" title="Heavy"><svg viewBox="0 0 40 30"><circle cx="10" cy="23" r="3.5"/><circle cx="20" cy="23" r="3.5"/><circle cx="30" cy="23" r="3.5"/><circle cx="15" cy="15" r="3.5"/><circle cx="25" cy="15" r="3.5"/><circle cx="20" cy="7" r="3.5"/></svg></button>
            </div>
          </div>
        </div>
        <div class="adv-foot">
          <div class="range"><label>Number Range</label><input id="r-lo" type="number" min="1" value="1"><input id="r-hi" type="number" min="1"></div>
          <div class="adv-actions">
            <button id="btn-reset" class="btn grey">Reset</button>
            <button id="btn-search" class="btn orange"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="10" cy="10" r="6" fill="none" stroke="#fff" stroke-width="3"/><path d="M15 15l6 6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg> Search</button>
          </div>
        </div>
      </div></div>

      <button id="toggle-adv" class="toggle"><span id="toggle-text">Show Advanced Search</span> <i class="chev"></i></button>
    </div>

    <div class="toolbar">
      <button id="btn-random" class="btn blue">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2l2.4 6.6L21 9l-5.2 4.4L17.5 20 12 16.2 6.5 20l1.7-6.6L3 9l6.6-.4z" fill="#fff"/></svg>
        Surprise Me!
      </button>
      <div class="sort"><span>Sort by</span>
        <select id="sort" class="select dark">
          <option value="asc">Lowest Number (First)</option>
          <option value="desc">Highest Number (First)</option>
          <option value="az">Name A → Z</option>
          <option value="za">Name Z → A</option>
        </select>
      </div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden"><div class="ball small"></div><p>No Pokémon match your search. Try loosening the filters or press Reset.</p></div>
    <div id="sentinel"></div>
  </section>

  <section id="view-detail" class="view hidden"></section>
</main>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
